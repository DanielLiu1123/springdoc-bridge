syntax = "proto3";

package payment.v1;

option java_multiple_files = true;
option java_package = "com.example.payment.v1";

// Demonstrates how a protobuf 'oneof' is mapped to an OpenAPI 'oneOf'
// when 'springdoc-bridge.protobuf.oneof-behavior' is set to 'one_of'.
//
// See: https://github.com/DanielLiu1123/springdoc-bridge/issues/23
message CreatePaymentRequest {
  string order_id = 1;
  int64 amount = 2;
  string currency = 3;

  // Exactly one payment method is expected. With the 'one_of' behavior this
  // group is rendered as an OpenAPI 'oneOf', documenting the mutual exclusion
  // between 'creditCard', 'bankTransfer' and 'digitalWallet'.
  oneof payment_method {
    CreditCard credit_card = 4;
    BankTransfer bank_transfer = 5;
    DigitalWallet digital_wallet = 6;
  }

  // A second oneof: the payer is either an existing customer or a guest.
  // A message may contain multiple oneof groups; each becomes its own 'oneOf'.
  oneof customer {
    string customer_id = 7;
    GuestCustomer guest = 8;
  }

  message GuestCustomer {
    string email = 1;
    string full_name = 2;
  }

  message CreditCard {
    string number = 1;
    string holder_name = 2;
    int32 expiry_month = 3;
    int32 expiry_year = 4;
    string cvv = 5;
  }

  message BankTransfer {
    string account_number = 1;
    string routing_number = 2;
    string bank_name = 3;
  }

  message DigitalWallet {
    WalletProvider provider = 1;
    string account_email = 2;

    enum WalletProvider {
      WALLET_PROVIDER_UNSPECIFIED = 0;
      PAYPAL = 1;
      APPLE_PAY = 2;
      GOOGLE_PAY = 3;
    }
  }
}

message CreatePaymentResponse {
  string payment_id = 1;
  string status = 2;
}
