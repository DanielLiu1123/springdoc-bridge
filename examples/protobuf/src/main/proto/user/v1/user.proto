syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.example.user.v1";

// User model
message User {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string display_name = 6;
  Gender gender = 7;
  int32 age = 8;
  UserStatus status = 9;
  Address address = 10;
  repeated Address addresses = 11;
  repeated PhoneNumber phone_numbers = 12;
  repeated string tags = 13;
  map<string, string> metadata = 14;
  map<string, PhoneNumber> phone_number_map = 15;
  map<string, UserStatus> enums_map = 200;
  UserPreferences preferences = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  google.protobuf.Timestamp last_login_at = 19;

  // Two oneof groups demonstrating the oneof -> oneOf mapping on the User message.
  // With 'springdoc-bridge.protobuf.oneof-behavior: one_of', each group becomes
  // its own 'oneOf' under the shared 'allOf'.

  // Exactly one primary contact channel (a oneof of scalar members).
  oneof primary_contact {
    string contact_email = 20;
    string contact_phone = 21;
  }

  // Exactly one identity document (a second oneof, of message members).
  oneof identity_document {
    Passport passport = 22;
    DriverLicense driver_license = 23;
  }

  // Nested message for passport
  message Passport {
    string number = 1;
    string country = 2;
  }

  // Nested message for driver license
  message DriverLicense {
    string number = 1;
    string state = 2;
  }

  // Nested message for address
  message Address {
    string street = 1;
    string city = 2;
    string state = 3;
    string postal_code = 4;
    string country = 5;
    AddressType type = 6;
    bool is_primary = 7;
  }

  // Nested message for phone number
  message PhoneNumber {
    string number = 1;
    PhoneType type = 2;
    string country_code = 3;
    bool is_primary = 4;
    bool is_verified = 5;
  }

  // Nested message for user preferences
  message UserPreferences {
    bool email_notifications = 1;
    bool sms_notifications = 2;
    bool marketing_emails = 3;
    string language = 4;
    string timezone = 5;
    Theme theme = 6;
  }

  // Gender enum
  enum Gender {
    GENDER_UNSPECIFIED = 0;
    MALE = 1;
    FEMALE = 2;
    OTHER = 3;
  }

  // User status enum
  enum UserStatus {
    STATUS_UNSPECIFIED = 0;
    ACTIVE = 1;
    INACTIVE = 2;
    SUSPENDED = 3;
    PENDING_VERIFICATION = 4;
    DELETED = 5;
  }

  // Address type enum
  enum AddressType {
    ADDRESS_TYPE_UNSPECIFIED = 0;
    HOME = 1;
    WORK = 2;
    BILLING = 3;
    SHIPPING = 4;
  }

  // Phone type enum
  enum PhoneType {
    PHONE_TYPE_UNSPECIFIED = 0;
    MOBILE = 1;
    HOME_PHONE = 2;
    WORK_PHONE = 3;
    FAX = 4;
  }

  // Theme enum
  enum Theme {
    THEME_UNSPECIFIED = 0;
    LIGHT = 1;
    DARK = 2;
    AUTO = 3;
  }
}

// Request/Response messages
message CreateUserRequest {
  User user = 1;

  // Demonstrates protobuf 'oneof' -> OpenAPI 'oneOf' mapping.
  // With 'springdoc-bridge.protobuf.oneof-behavior: one_of', each of the two
  // oneof groups below is rendered as its own 'oneOf' under a shared 'allOf'.
  // See: https://github.com/DanielLiu1123/springdoc-bridge/issues/23

  // Exactly one invitation source (a oneof of scalar members).
  oneof invitation {
    string referral_code = 2;
    string promo_code = 3;
  }

  // Exactly one initial credential (a second oneof, of message members).
  oneof credential {

    PasswordCredential password = 4;
    OAuthCredential oauth = 5;
  }

  message PasswordCredential {
    string password = 1;
  }

  message OAuthCredential {
    string provider = 1;
    string token = 2;
  }
}

message CreateUserResponse {
  User user = 1;
  string message = 2;
}

message GetUserRequest {
  string user_id = 1;
  repeated string fields = 2; // Field mask for partial response
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  User user = 2;
}

message UpdateUserResponse {
  User user = 1;
  string message = 2;
}

message PatchUserRequest {
  optional string username = 2;
  optional string email = 3;
  optional string first_name = 4;
  optional string last_name = 5;
  optional User.Gender gender = 6;
  optional int32 age = 7;
  optional User.UserStatus status = 8;
}

message PatchUserResponse {
  User user = 1;
  string message = 2;
}

message DeleteUserRequest {
  string user_id = 1;
  bool soft_delete = 2; // Whether to soft delete or hard delete
}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
  User.UserStatus status_filter = 3;
  User.Gender gender_filter = 4;
  string search_query = 5;
  repeated string sort_by = 6;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchUsersRequest {
  string query = 1;
  repeated User.UserStatus status_filters = 2;
  repeated User.Gender gender_filters = 3;
  int32 min_age = 4;
  int32 max_age = 5;
  repeated string tags = 6;
  int32 limit = 7;
  int32 offset = 8;
}

message SearchUsersResponse {
  repeated User users = 1;
  int32 total_count = 2;
  map<string, int32> facets = 3; // Aggregation results
}

message BatchCreateUsersRequest {
  repeated User users = 1;
  bool skip_duplicates = 2;
}

message BatchCreateUsersResponse {
  repeated User created_users = 1;
  repeated string failed_user_ids = 2;
  string message = 3;
  int32 success_count = 4;
  int32 failure_count = 5;
}
